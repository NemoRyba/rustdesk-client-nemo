org.gradle.jvmargs=-Xmx1024M
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=false

# TBFDesk Android application id (the id Android and app stores know the app by).
# PERMANENT once the first release APK is installed anywhere: a different id is a
# different app (no update path, settings not carried over). Decide before release.
# Only the id changes here -- the Kotlin code package stays com.carriez.flutter_hbb
# (manifest `package`, R/BuildConfig) and the JNI class stays `ffi.FFI`.
# (A Gradle -P tbfdesk.applicationId=... on the command line overrides this file.)
tbfdesk.applicationId=at.tbf.tbfdesk

# TBFDesk SDK levels. Operator decision 2026-11-02: minimum = Android 17 (API 37), the
# reference/test device is a Pixel 7a. Phones below Android 17 cannot install the app.
# compileSdk must be >= minSdk. AGP 7.3.1 (settings.gradle) predates API 37: the first
# Android build must confirm it compiles; if not, raise AGP/Gradle (see FLUTTER-PORT §9b A6).
tbfdesk.minSdk=37
tbfdesk.targetSdk=37
# The SDK installs API 37 as "platforms;android-37.0" (minor-version naming); AGP 7.3.1
# resolves only android-<int> from a number, so give it the hash.
tbfdesk.compileSdk=android-37.0
android.suppressUnsupportedCompileSdk=37

# AGP 8 + Kotlin 2: old Flutter plugins (external_path 1.0.3) compile Java for 1.8 and Kotlin
# for 17 in the same module; the Kotlin plugin now fails on that. Both are compiled by D8 for
# the API 37 runtime, so the mismatch is harmless: warn instead of failing.
kotlin.jvm.target.validation.mode=warning
